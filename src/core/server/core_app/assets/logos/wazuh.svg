<!--
  TripleSOC Logo (Light Mode)
  Full wordmark with shield icon
  TripleCyber / DataSync Dynamics
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Shield Icon -->
  <g transform="translate(4, 4)">
    <!-- Shield outline -->
    <path d="M20 2L4 8v12c0 9.33 6.83 18.06 16 20 9.17-1.94 16-10.67 16-20V8L20 2z" fill="#E8EDF5" stroke="#1E293B" stroke-width="1.5"/>
    <!-- Zone layers -->
    <!-- Bottom zone: Anonymous (red) -->
    <rect x="10" y="24" width="20" height="5" rx="1.5" fill="#F44336"/>
    <!-- Middle zone: Verified (amber) -->
    <rect x="10" y="17" width="20" height="5" rx="1.5" fill="#FFC107"/>
    <!-- Top zone: Secure (green) -->
    <rect x="10" y="10" width="20" height="5" rx="1.5" fill="#4CAF50"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E293B">
    <tspan>Triple</tspan><tspan fill="#1E40AF">SOC</tspan>
  </text>
</svg>
